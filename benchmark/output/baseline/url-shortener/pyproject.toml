[project]
name = "url-shortener"
version = "1.0.0"
description = "A small URL shortener HTTP API (shorten, redirect, click stats, rate limiting)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=4",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/__init__.py"]
